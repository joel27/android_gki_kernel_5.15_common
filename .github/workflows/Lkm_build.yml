name: ReSukiSU LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout GKI kernel source (android13-5.15-8gen2)
        uses: actions/checkout@v4
        with:
          repository: joel27/android_gki_kernel_5.15_common
          ref: android13-5.15-8gen2
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-vermeer-lkm-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-vermeer-lkm-

      - name: Install dependencies (incluyendo ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-14 dwarves

      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version
          ccache --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      - name: Install ReSukiSU (inline hook)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/joel27/ReSukiSU/main/kernel/setup.sh" \
            | bash -s main
          echo "ReSukiSU installed"

      - name: Fix sulog type mismatch
        run: |
          SULOG=drivers/kernelsu/sulog/event.c
          if [ -f "$SULOG" ]; then
            sed -i 's/USER_ARG_NULL,/\&(struct user_arg_ptr){ 0 },/g' "$SULOG"
            echo "Patched $SULOG"
          fi

      - name: Apply SuSFS (susfs4ksu 50_)
        run: |
          git clone --depth=1 -b gki-android13-5.15 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -R /tmp/susfs4ksu/kernel_patches/fs/*      fs/
          cp -R /tmp/susfs4ksu/kernel_patches/include/* include/
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          echo "SuSFS base applied"

      # No hace falta el shim de VMA_PAD_START aquí: ese problema es en
      # fs/proc/task_mmu.c, y en este workflow NO se compila el kernel
      # completo (solo el módulo drivers/kernelsu/), así que ese archivo ni
      # se toca.

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

      # DIFERENCIA CLAVE vs el workflow normal: CONFIG_KSU se pone en "m"
      # (módulo) en vez de "y" (compilado adentro del kernel). Confirmado en
      # el propio Kconfig de ReSukiSU: "config KSU / tristate ... / Choose
      # "m" here to build KernelSU as LKM". CONFIG_KALLSYMS se queda en y —
      # es "bool" en Linux (no admite módulo) y KSU lo selecciona como
      # dependencia obligatoria de todos modos.
      #
      # Sobre el hook: en este Kconfig, "KSU_MANUAL_HOOK" tiene
      # "depends on KSU != m" — o sea que NO es compatible con LKM. Las
      # opciones que sí quedan disponibles con KSU=m son Tracepoint Hook o
      # "KSU_SUSFS" (etiquetado como "SUSFS Inline Hook" en su Kconfig, sin
      # esa restricción). Como quieres SUSFS, se deja esa activa.
      - name: Configure kernel (KSU como módulo)
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --module  CONFIG_KSU \
            --enable  CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE \
            --set-str CONFIG_LOCALVERSION "-Tech-Kernel" \
            --disable CONFIG_LOCALVERSION_AUTO

          ./scripts/config --file out/.config --disable CONFIG_LLVM_POLLY || true

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # Preparación estándar de kernel para poder compilar módulos sueltos
      # (genera Module.symvers y headers que el build del módulo necesita).
      - name: modules_prepare
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare 2>&1 | tee prepare.log

      # FIX: "include/generated/compile.h" no es invocable directo desde el
      # make de nivel superior aunque la regla exista en init/Makefile —
      # Kbuild solo rutea bien los targets ".o" a través de su descenso
      # recursivo, no rutas de headers generados sueltas ("No rule to make
      # target"). En vez de apuntar al header, se apunta al .o que lo
      # necesita: init/version.o genera compile.h como efecto colateral, y
      # security/selinux/hooks.o genera flask.h + av_permissions.h (todos
      # los .o de selinux dependen de flask.h en su Makefile).
      - name: Generate missing headers (compile.h, flask.h)
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            init/version.o security/selinux/hooks.o

      # Build dirigido SOLO a drivers/kernelsu/ (donde setup.sh deja el
      # symlink al driver), no al kernel completo. Mucho más rápido que
      # "make Image", y no compila nada fuera de ese directorio.
      - name: Build kernelsu.ko
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/kernelsu modules \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %b %d %H:%M:%S UTC %Y')" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="esk" \
            2>&1 | tee build.log
          find out -name "kernelsu.ko" -exec cp {} ./kernelsu.ko \;
          ls -la kernelsu.ko

      # ksuinit es un binario chiquito en Rust (stub de arranque que hace
      # insmod del .ko antes del init real) — no depende de tus parches de
      # kernel, así que en vez de meter un toolchain de Rust al workflow solo
      # para esto, se baja precompilado del release oficial de KernelSU
      # (verificado: se publica como asset de GitHub Releases, HTTP 200).
      - name: Fetch ksuinit (binario oficial precompilado)
        run: |
          curl -fL -o ksuinit \
            "https://github.com/tiann/KernelSU/releases/latest/download/ksuinit"
          chmod +x ksuinit
          ls -la ksuinit

      - name: Package LKM artifact
        run: |
          mkdir -p lkm_out
          cp kernelsu.ko lkm_out/
          cp ksuinit lkm_out/
          printf '%s\n' \
            'Este paquete NO es flasheable directo. Contiene:' \
            '  - kernelsu.ko  (tu modulo custom, con SUSFS, compilado en CI)' \
            '  - ksuinit      (stub oficial de KernelSU, binario generico)' \
            '' \
            'Para meterlo en tu boot.img / init_boot.img (Android 13+ suele ser' \
            'init_boot.img), en tu PC o en Termux en el propio telefono, con magiskboot:' \
            '' \
            '  magiskboot unpack init_boot.img' \
            '  magiskboot cpio ramdisk.cpio "mv init init.real"' \
            '  magiskboot cpio ramdisk.cpio "add 0755 init ksuinit"' \
            '  magiskboot cpio ramdisk.cpio "add 0755 kernelsu.ko kernelsu.ko"' \
            '  magiskboot repack init_boot.img' \
            '  # el resultado queda en new-boot.img, eso es lo que flasheas con fastboot' \
            '' \
            'Guarda tu init_boot.img original antes de tocar nada. Este flujo no ha' \
            'sido probado en tu equipo todavia -- si kernelsu.ko no carga o el manager' \
            'no lo detecta, es muy probable que sea un choque de version de simbolos' \
            '(KMI) entre este build y tu kernel stock real, no un error de compilacion.' \
            > lkm_out/LEEME.txt
          cd lkm_out
          zip -r9 ../Tech-Kernel-LKM-vermeer.zip .

      - name: Upload LKM package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-LKM-vermeer
          path: Tech-Kernel-LKM-vermeer.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-lkm
          path: |
            build.log
            prepare.log
